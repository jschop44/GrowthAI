name: GrowthLens regression tests
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GROWTHLENS_PRIVATE_KEY: ci-test-only
      GROWTHLENS_DB: /tmp/growthlens-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q backend
      - run: python -m pytest -q tests/test_growth_upgrade.py
