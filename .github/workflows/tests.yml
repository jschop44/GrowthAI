name: GrowthLens regression tests
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GROWTHLENS_PRIVATE_KEY: ci-test-only
      GROWTHLENS_DB: /tmp/growthlens-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q backend
      - run: python -m pytest -q tests/test_growth_upgrade.py

  live-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect live Growth Lens and LeadFlow health without secrets
        run: |
          python - <<'PY'
          import json,urllib.request
          for name,url in [('Growth Lens','https://growthlens-free-test.onrender.com/api/health'),('LeadFlow','https://leadflow-research-api.onrender.com/health'),('Shared feedback readiness','https://growthlens-free-test.onrender.com/api/intelligence/leadflow-feedback-readiness')]:
              try:
                  with urllib.request.urlopen(url,timeout=45) as response:
                      data=json.load(response)
                  if name=='Shared feedback readiness':
                      print(json.dumps({'service':name,'authorized':data.get('authorized'),'persistent_catalog':data.get('persistent_catalog'),'reason':data.get('reason')}))
                  elif name=='LeadFlow':
                      print(json.dumps({'service':name,'health':data.get('status'),'sharedIntelligence':data.get('sharedIntelligence'),'storage':data.get('onlineCatalog',{}).get('storage')}))
                  else:
                      print(json.dumps({'service':name,'health':data.get('status'),'fields':sorted(data.keys())}))
              except Exception as error:
                  print(json.dumps({'service':name,'error':str(error)}))
          PY
