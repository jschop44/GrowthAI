name: GrowthLens regression tests
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GROWTHLENS_PRIVATE_KEY: ci-test-only
      GROWTHLENS_DB: /tmp/growthlens-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate Growth Lens inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const html=fs.readFileSync('frontend/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/g)].map(m=>m[1]).filter(Boolean);
          if(!scripts.length)throw Error('Growth Lens inline script missing');
          for(let i=0;i<scripts.length;i++){
            const path='/tmp/growth-lens-inline-'+i+'.js';
            fs.writeFileSync(path,scripts[i]);
            cp.execFileSync('node',['--check',path],{stdio:'inherit'});
          }
          NODE
      - run: python -m compileall -q backend
      - run: python -m pytest -q tests/test_growth_upgrade.py tests/test_knowledge_access.py

  live-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect live Growth Lens and LeadFlow health without secrets
        run: |
          python - <<'PY'
          import json,urllib.request
          for name,url in [('Growth Lens','https://growthlens-free-test.onrender.com/api/health'),('LeadFlow','https://leadflow-research-api.onrender.com/health'),('Shared feedback readiness','https://growthlens-free-test.onrender.com/api/intelligence/leadflow-feedback-readiness')]:
              try:
                  with urllib.request.urlopen(url,timeout=45) as response:
                      data=json.load(response)
                  if name=='Shared feedback readiness':
                      print(json.dumps({'service':name,'authorized':data.get('authorized'),'persistent_catalog':data.get('persistent_catalog'),'reason':data.get('reason')}))
                  elif name=='LeadFlow':
                      print(json.dumps({'service':name,'health':data.get('status'),'sharedIntelligence':data.get('sharedIntelligence'),'storage':data.get('onlineCatalog',{}).get('storage'),'knowledgeBase':data.get('knowledgeBase')}))
                  else:
                      print(json.dumps({'service':name,'health':data.get('status'),'fields':sorted(data.keys()),'knowledge_base':data.get('knowledge_base')}))
              except urllib.error.HTTPError as error:
                  if name=='Shared feedback readiness' and error.code==401:
                      print(json.dumps({'service':name,'access':'owner_auth_required','verified':False}))
                  else:
                      print(json.dumps({'service':name,'http_status':error.code,'verified':False}))
              except Exception as error:
                  print(json.dumps({'service':name,'error':str(error),'verified':False}))
          PY
