name: GrowthLens upgrade validation
on:
  push:
    branches: [growthlens-v1-1-review]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -m pytest -q tests
      - run: python -m compileall -q backend
      - run: node --check frontend/local-competition.js
      - run: node --check frontend/local-premium.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Chromium responsive UI smoke tests
        run: |
          GROWTHLENS_PRIVATE_KEY=testing-secret python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break || sleep 1; done
          node tests/browser_smoke.cjs
      - run: docker build -t growthlens-validation .
      - run: python -c "from backend.main import app; from fastapi.testclient import TestClient; c=TestClient(app); assert c.get('/api/health').status_code==200; assert c.post('/api/local-competition',json={'url':'https://example.com','radius_miles':15}).status_code==401"
