name: GrowthLens upgrade validation
on:
  push:
    branches: [growthlens-v1-1-review, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: growthlens-upgrade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      audit-postgres:
        image: postgres:16
        env:
          POSTGRES_DB: growthlens_storage_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d growthlens_storage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip==26.3 && python -m pip install -r requirements.txt
      - name: Verify encrypted audit-history backups
        run: node --test tests/audit-backup.test.mjs
      - name: Python regression suite
        run: PYTHONPATH=. python -m pytest -ra -vv tests
      - name: Verify durable audit storage against disposable PostgreSQL
        env:
          GROWTHLENS_AUDIT_TEST_DSN: postgresql://postgres:ci-only@127.0.0.1:5432/growthlens_storage_test
        run: python -m pytest -q tests/test_postgres_audit_storage.py
      - run: python -m compileall -q backend
      - run: node --check frontend/local-competition.js
      - run: node --check frontend/local-premium.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Chromium responsive UI smoke tests
        run: |
          GROWTHLENS_PRIVATE_KEY=testing-secret python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break || sleep 1; done
          node tests/browser_smoke.cjs
      - name: Docker image build
        run: docker build -t growthlens-validation .
      - name: API authentication smoke test
        run: python -c "from backend.main import app; from fastapi.testclient import TestClient; c=TestClient(app); assert c.get('/api/health').status_code==200; assert c.post('/api/local-competition',json={'url':'https://example.com','radius_miles':15}).status_code==401"
